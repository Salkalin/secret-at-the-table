services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mystery
      POSTGRES_PASSWORD: mystery
      POSTGRES_DB: mystery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mystery"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
